[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbrm"
version = "0.3.1"
description = "BERO HOST management: the customer panel and its VNC console, as a library and a CLI"
readme = "README.md"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
license-files = ["LICENSE", "LICENSE.md", "LICENSES/*"]
authors = [{ name = "Julian Y. Richard Corbet" }]
keywords = ["bero-host", "bero", "kvm", "vps", "rootserver", "proxmox", "novnc", "mcp", "cli", "hosting"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Intended Audience :: System Administrators", "Topic :: System :: Systems Administration"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "selectolax>=0.3.21", "websockets>=12", "vncdotool>=1.2", "pillow>=10", "mcp>=1.2", "fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://git.corbet.ch/corbet-infra/cbrm"
Issues = "https://git.corbet.ch/corbet-infra/cbrm/issues"

[project.scripts]
cbrm = "cbrm.cli:main"
cbrm-mcp = "cbrm.mcp:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
